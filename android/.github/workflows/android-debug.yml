name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore official Gradle Wrapper when missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.6.0
          fi
          chmod +x gradlew
      - name: Static audit
        run: python3 tools/audit_project.py
      - name: Build
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Prepare APK and report
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/LocalLS-v0.9.3-debug.apk
          python3 tools/verify_apk.py artifacts/LocalLS-v0.9.3-debug.apk
          HASH=$(sha256sum artifacts/LocalLS-v0.9.3-debug.apk | awk '{print $1}')
          SIZE=$(stat -c%s artifacts/LocalLS-v0.9.3-debug.apk)
          printf '# BUILD REPORT\n\n- Status: BUILD SUCCESSFUL\n- APK: artifacts/LocalLS-v0.9.3-debug.apk\n- Size: %s bytes\n- SHA-256: %s\n' "$SIZE" "$HASH" > BUILD_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: LocalLS-v0.9.3-debug
          path: |
            artifacts/LocalLS-v0.9.3-debug.apk
            BUILD_REPORT.md
