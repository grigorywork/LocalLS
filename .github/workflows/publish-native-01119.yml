name: Publish LocalLS Android 0.11.19
on:
  push:
    branches: [codex/publish-native-01119]
    paths: ['.github/workflows/publish-native-01119.yml', 'release-artifacts/android-0.11.19/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.19
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.19.txt
          echo 'bf9e670d68e719b5ec671b2fd15e437e0621d6583d6dff2c3d50a289c0c51f6c  LocalLS-0.11.19-release.apk' | sha256sum -c -
      - name: Publish APK and setup guide
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.19
        run: |
          gh release upload android-v0.11.19 --repo grigorywork/LocalLS --clobber LocalLS-0.11.19-release.apk LocalLS-0.11.19-source.zip LocalLS-0.11.19-verification.json LocalLS-0.11.19-report.md LocalLS-0.11.19-release-notes.md SHA256SUMS-Android-0.11.19.txt LocalLS-0.11.19-setup.txt
          gh release edit android-v0.11.19 --repo grigorywork/LocalLS --draft=false --prerelease=false --latest
