name: Publish embedded SFTP Android 0.11.5
on:
  push:
    branches: [codex/publish-native-0115]
    paths: ['.github/workflows/publish-native-0115.yml', 'release-artifacts/android-0.11.5/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.5
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.5.txt
          echo 'aa1ef97aebe3ce0957b49c537599e138260c1cd3a35721da996614ae5ebf9bab  LocalLS-0.11.5-release.apk' | sha256sum -c -
      - name: Publish preliminary server build
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.5
        run: |
          gh release upload android-v0.11.5 --repo grigorywork/LocalLS --clobber LocalLS-0.11.5-release.apk LocalLS-0.11.5-source.zip LocalLS-0.11.5-verification.json LocalLS-0.11.5-report.md LocalLS-0.11.5-release-notes.md SHA256SUMS-Android-0.11.5.txt LocalLS-0.11.5-setup.txt
          gh release edit android-v0.11.5 --repo grigorywork/LocalLS --draft=false --prerelease --latest=false
