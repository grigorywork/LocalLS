name: Android release signature verification
on:
  workflow_dispatch:
    inputs:
      preview_run:
        description: Successful Android verification run for the exact tested preview
        required: true
        default: '38210324771'
      tested_commit:
        description: Exact source commit built by that run
        required: true
        default: '2021449b3ccdfe2dd46096ac0b876345678333d1'
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_RUN: ${{ inputs.preview_run }}
      TESTED_COMMIT: ${{ inputs.tested_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-sdk-licenses: false
      - name: Download tested preview and signed release
        run: |
          test "$(gh api "repos/$GH_REPO/actions/runs/$PREVIEW_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$PREVIEW_RUN" --jq .head_sha)" = "$TESTED_COMMIT"
          test "$(gh api "repos/$GH_REPO/actions/runs/$PREVIEW_RUN" --jq .name)" = 'Android verification'
          gh run download "$PREVIEW_RUN" --name LocalLS-Android-0.9.6-preview-and-verification --dir preview
          gh release download android-v0.9.6 --pattern LocalLS-v0.9.6-debug.apk --dir release
      - name: Verify APK metadata, original certificate and every payload entry
        run: |
          sdkmanager 'build-tools;36.0.0'
          python3 android/tools/verify_apk.py release/LocalLS-v0.9.6-debug.apk > release/apk-verification.json
          python3 android/tools/verify_signed_payload.py \
            preview/artifacts/LocalLS-v0.9.6-preview-debug.apk \
            release/LocalLS-v0.9.6-debug.apk \
            preview/artifacts/preview-verification.json \
            release/apk-verification.json > release/SIGNING_VERIFICATION_0.9.6.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('release/SIGNING_VERIFICATION_0.9.6.json')
          report = json.loads(path.read_text())
          report['testedSourceCommit'] = os.environ['TESTED_COMMIT']
          report['previewRun'] = int(os.environ['PREVIEW_RUN'])
          report['verificationRun'] = os.environ['GITHUB_RUN_ID']
          path.write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Publish verification proof
        run: gh release upload android-v0.9.6 release/SIGNING_VERIFICATION_0.9.6.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocalLS-Android-0.9.6-release-verification
          path: release/*.json
          if-no-files-found: warn
