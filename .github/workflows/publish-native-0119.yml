name: Publish LocalLS Android 0.11.9
on:
  push:
    branches: [codex/publish-native-0119]
    paths: ['.github/workflows/publish-native-0119.yml', 'release-artifacts/android-0.11.9/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.9
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.9.txt
          echo 'b336626253d3e4f21ca1fa4489e8e39a2df7a7c015a8e00971d95cad436b196b  LocalLS-0.11.9-release.apk' | sha256sum -c -
      - name: Publish APK and setup guide
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.9
        run: |
          gh release upload android-v0.11.9 --repo grigorywork/LocalLS --clobber LocalLS-0.11.9-release.apk LocalLS-0.11.9-source.zip LocalLS-0.11.9-verification.json LocalLS-0.11.9-report.md LocalLS-0.11.9-release-notes.md SHA256SUMS-Android-0.11.9.txt LocalLS-0.11.9-setup.txt
          gh release edit android-v0.11.9 --repo grigorywork/LocalLS --draft=false --prerelease=false --latest
