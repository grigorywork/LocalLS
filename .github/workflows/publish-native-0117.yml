name: Publish LocalLS Android 0.11.7
on:
  push:
    branches: [codex/publish-native-0117]
    paths: ['.github/workflows/publish-native-0117.yml', 'release-artifacts/android-0.11.7/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.7
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.7.txt
          echo '4a7ad237d452e37959f26d1b3f8cafdcfcd2057e701bf1799a16761133e86d57  LocalLS-0.11.7-release.apk' | sha256sum -c -
      - name: Publish APK and setup guide
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.7
        run: |
          gh release upload android-v0.11.7 --repo grigorywork/LocalLS --clobber LocalLS-0.11.7-release.apk LocalLS-0.11.7-source.zip LocalLS-0.11.7-verification.json LocalLS-0.11.7-report.md LocalLS-0.11.7-release-notes.md SHA256SUMS-Android-0.11.7.txt LocalLS-0.11.7-setup.txt
          gh release edit android-v0.11.7 --repo grigorywork/LocalLS --draft=false --prerelease=false --latest
