name: Android verification
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'codex/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Audit and build
        run: |
          python3 ../tools/check_versions.py
          python3 tools/audit_project.py
          python3 tools/audit_architecture.py
          python3 tools/test_agent_security.py
          python3 tools/test_wizard_agent.py
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :transport:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify preview APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/LocalLS-v0.9.6-preview-debug.apk
          python3 tools/verify_apk.py artifacts/LocalLS-v0.9.6-preview-debug.apk > artifacts/preview-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocalLS-Android-0.9.6-preview-and-verification
          path: |
            android/artifacts/LocalLS-v0.9.6-preview-debug.apk
            android/artifacts/preview-verification.json
            android/app/build/reports/
            android/app/build/ui-previews/
            android/core/build/test-results/
            android/transport/build/test-results/
          if-no-files-found: warn
