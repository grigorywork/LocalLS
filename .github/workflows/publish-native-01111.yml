name: Publish LocalLS Android 0.11.11
on:
  push:
    branches: [codex/publish-native-01111]
    paths: ['.github/workflows/publish-native-01111.yml', 'release-artifacts/android-0.11.11/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.11
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.11.txt
          echo 'f556025e274fc850d0d90bc6f3048fbe7303294b32bfc4b8d65926bddf8324e5  LocalLS-0.11.11-release.apk' | sha256sum -c -
      - name: Publish APK and setup guide
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.11
        run: |
          gh release upload android-v0.11.11 --repo grigorywork/LocalLS --clobber LocalLS-0.11.11-release.apk LocalLS-0.11.11-source.zip LocalLS-0.11.11-verification.json LocalLS-0.11.11-report.md LocalLS-0.11.11-release-notes.md SHA256SUMS-Android-0.11.11.txt LocalLS-0.11.11-setup.txt
          gh release edit android-v0.11.11 --repo grigorywork/LocalLS --draft=false --prerelease=false --latest
