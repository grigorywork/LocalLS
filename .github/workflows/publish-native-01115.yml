name: Publish LocalLS Android 0.11.15
on:
  push:
    branches: [codex/publish-native-01115]
    paths: ['.github/workflows/publish-native-01115.yml', 'release-artifacts/android-0.11.15/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.15
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.15.txt
          echo '6a7c68e2871a0ebe78b5ad58fa3ed34d49cc5aa65dd4f1b15736e8aa2491a5e4  LocalLS-0.11.15-release.apk' | sha256sum -c -
      - name: Publish APK and setup guide
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.15
        run: |
          gh release upload android-v0.11.15 --repo grigorywork/LocalLS --clobber LocalLS-0.11.15-release.apk LocalLS-0.11.15-source.zip LocalLS-0.11.15-verification.json LocalLS-0.11.15-report.md LocalLS-0.11.15-release-notes.md SHA256SUMS-Android-0.11.15.txt LocalLS-0.11.15-setup.txt
          gh release edit android-v0.11.15 --repo grigorywork/LocalLS --draft=false --prerelease=false --latest
