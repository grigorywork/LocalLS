name: Publish LocalLS Android 0.11.20
on:
  push:
    branches: [codex/publish-native-01120]
    paths: ['.github/workflows/publish-native-01120.yml', 'release-artifacts/android-0.11.20/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.20
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.20.txt
          echo 'bc4b79d69e769fe9d1c4fb5cb885d2b6c2f76022dc2b1f08631280efb170643f  LocalLS-0.11.20-release.apk' | sha256sum -c -
      - name: Publish APK and setup guide
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.20
        run: |
          gh release upload android-v0.11.20 --repo grigorywork/LocalLS --clobber LocalLS-0.11.20-release.apk LocalLS-0.11.20-source.zip LocalLS-0.11.20-verification.json LocalLS-0.11.20-report.md LocalLS-0.11.20-release-notes.md SHA256SUMS-Android-0.11.20.txt LocalLS-0.11.20-setup.txt
          gh release edit android-v0.11.20 --repo grigorywork/LocalLS --draft=false --prerelease=false --latest
