name: Publish LocalLS Android 0.11.14
on:
  push:
    branches: [codex/publish-native-01114]
    paths: ['.github/workflows/publish-native-01114.yml', 'release-artifacts/android-0.11.14/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.14
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.14.txt
          echo '01ecc95e8bae3d8320e33ba0a82ed12bbe184d9dbb7b6e1d0722eb500fcafcb5  LocalLS-0.11.14-release.apk' | sha256sum -c -
      - name: Publish APK and setup guide
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.14
        run: |
          gh release upload android-v0.11.14 --repo grigorywork/LocalLS --clobber LocalLS-0.11.14-release.apk LocalLS-0.11.14-source.zip LocalLS-0.11.14-verification.json LocalLS-0.11.14-report.md LocalLS-0.11.14-release-notes.md SHA256SUMS-Android-0.11.14.txt LocalLS-0.11.14-setup.txt
          gh release edit android-v0.11.14 --repo grigorywork/LocalLS --draft=false --prerelease=false --latest
