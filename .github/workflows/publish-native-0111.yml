name: Publish embedded SFTP Android 0.11.1
on:
  push:
    branches: [codex/publish-native-0111]
    paths: ['.github/workflows/publish-native-0111.yml', 'release-artifacts/android-0.11.1/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.1
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.1.txt
          echo '63db3b702e93ad1e707b1f389ea1ced34d9f7535123c5da98215600af6888a56  LocalLS-0.11.1-release.apk' | sha256sum -c -
      - name: Publish preliminary server build
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.1
        run: |
          gh release upload android-v0.11.1 --repo grigorywork/LocalLS --clobber LocalLS-0.11.1-release.apk LocalLS-0.11.1-source.zip LocalLS-0.11.1-verification.json LocalLS-0.11.1-report.md LocalLS-0.11.1-release-notes.md SHA256SUMS-Android-0.11.1.txt LocalLS-0.11.1-ui-previews.zip
          gh release edit android-v0.11.1 --repo grigorywork/LocalLS --draft=false --prerelease --latest=false
