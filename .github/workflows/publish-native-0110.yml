name: Publish embedded SFTP Android 0.11.0
on:
  push:
    branches: [codex/publish-native-0110]
    paths: ['.github/workflows/publish-native-0110.yml', 'release-artifacts/android-0.11.0/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.0
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.0.txt
          echo 'e6c6e311fbd9cc4bc19efc57b9000e61208bcb046cc483167d4c418defe7d968  LocalLS-0.11.0-release.apk' | sha256sum -c -
      - name: Publish preliminary server build
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.0
        run: |
          gh release upload android-v0.11.0 --repo grigorywork/LocalLS --clobber LocalLS-0.11.0-release.apk LocalLS-0.11.0-source.zip LocalLS-0.11.0-verification.json LocalLS-0.11.0-report.md LocalLS-0.11.0-release-notes.md SHA256SUMS-Android-0.11.0.txt
          gh release edit android-v0.11.0 --repo grigorywork/LocalLS --draft=false --prerelease --latest=false
