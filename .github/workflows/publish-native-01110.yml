name: Publish LocalLS Android 0.11.10
on:
  push:
    branches: [codex/publish-native-01110]
    paths: ['.github/workflows/publish-native-01110.yml', 'release-artifacts/android-0.11.10/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prepared signed release
        working-directory: release-artifacts/android-0.11.10
        run: |
          sha256sum -c SHA256SUMS-Android-0.11.10.txt
          echo 'b4db3c5283de17d96c712f14fa16896d883437ed9609a0e1d99a0e67a3bfab93  LocalLS-0.11.10-release.apk' | sha256sum -c -
      - name: Publish APK and setup guide
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/android-0.11.10
        run: |
          gh release upload android-v0.11.10 --repo grigorywork/LocalLS --clobber LocalLS-0.11.10-release.apk LocalLS-0.11.10-source.zip LocalLS-0.11.10-verification.json LocalLS-0.11.10-report.md LocalLS-0.11.10-release-notes.md SHA256SUMS-Android-0.11.10.txt LocalLS-0.11.10-setup.txt
          gh release edit android-v0.11.10 --repo grigorywork/LocalLS --draft=false --prerelease=false --latest
